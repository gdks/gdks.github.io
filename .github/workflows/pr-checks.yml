name: PR Checks

on:
  pull_request:
    branches: [ main, develop ]
  pull_request_target:
    branches: [ main, develop ]

env:
  NODE_VERSION: '18'

jobs:
  # Quick validation jobs for PR feedback
  pr-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # For pull_request_target, we need to checkout the PR head
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm init -y
          npm install --save-dev htmlhint stylelint stylelint-config-standard eslint prettier

      - name: HTML Linting
        run: npx htmlhint "**/*.html"

      - name: CSS Linting
        run: |
          echo '{"extends": "stylelint-config-standard", "rules": {"at-rule-no-unknown": [true, {"ignoreAtRules": ["supports"]}]}}' > .stylelintrc.json
          npx stylelint "**/*.css"

      - name: JavaScript Linting
        run: |
          echo '{"extends": ["eslint:recommended"], "env": {"browser": true, "es2021": true}, "parserOptions": {"ecmaVersion": 12, "sourceType": "module"}}' > .eslintrc.json
          npx eslint "**/*.js" --ignore-pattern "**/*.min.js"

      - name: Code Formatting Check
        run: npx prettier --check "**/*.{html,css,js,json,md}"

  # HTML Validation
  html-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: HTML5 Validator
        uses: Cyb3r-Jak3/html5validator-action@v7.2.0
        with:
          root: ./
          css: true
          format: json

  # Basic Security Check
  basic-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check for hardcoded secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

  # PR Summary
  pr-summary:
    runs-on: ubuntu-latest
    needs: [pr-validation, html-validation, basic-security]
    if: always()
    steps:
      - name: PR Check Summary
        run: |
          echo "## PR Check Results" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Code Quality | ${{ needs.pr-validation.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| HTML Validation | ${{ needs.html-validation.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Check | ${{ needs.basic-security.result }} |" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.pr-validation.result }}" == "success" ] && 
             [ "${{ needs.html-validation.result }}" == "success" ] && 
             [ "${{ needs.basic-security.result }}" == "success" ]; then
            echo "✅ All PR checks passed!" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Some PR checks failed. Please review and fix issues." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Comment PR
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && comment.body.includes('## PR Check Results')
            );
            
            const status = '${{ needs.pr-validation.result }}' === 'success' && 
                          '${{ needs.html-validation.result }}' === 'success' && 
                          '${{ needs.basic-security.result }}' === 'success' ? 'success' : 'failure';
            
            const body = `## PR Check Results
            
            | Check | Status |
            |-------|--------|
            | Code Quality | ${{ needs.pr-validation.result }} |
            | HTML Validation | ${{ needs.html-validation.result }} |
            | Security Check | ${{ needs.basic-security.result }} |
            
            ${status === 'success' ? '✅ All PR checks passed!' : '❌ Some PR checks failed. Please review and fix issues.'}
            
            ---
            *Updated: ${new Date().toISOString()}*`;
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }