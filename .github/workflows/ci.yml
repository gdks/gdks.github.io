name: CI/CD Pipeline

on:
  pull_request:
    branches: [main, master, develop, feature/*, bugfix/*, hotfix/*]
  push:
    branches: [main, master, develop, feature/*, bugfix/*, hotfix/*]
  workflow_dispatch:

env:
  NODE_VERSION: '18'

jobs:
  # ============================================================================
  # CODE QUALITY CHECKS
  # ============================================================================

  code-quality:
    name: Code Quality & Standards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm init -y
          npm install --save-dev htmlhint stylelint stylelint-config-standard eslint prettier html-validate

      - name: HTML Linting
        run: npx htmlhint "**/*.html"

      - name: CSS Linting
        run: npx stylelint "**/*.css"

      - name: JavaScript Linting
        run: npx eslint "**/*.js" --ignore-pattern "**/*.min.js"

      - name: Code Formatting Check
        run: npx prettier --check "**/*.{html,css,js,json,md}"

      - name: HTML Validation
        run: npx html-validate "**/*.html"

  # ============================================================================
  # SECURITY CHECKS
  # ============================================================================

  security-scan:
    name: Security Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        if: github.token != ''
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        if: always() && github.token != '' && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Check for hardcoded secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --debug --only-verified

      - name: Dependency Review
        uses: actions/dependency-review-action@v3
        with:
          fail-on-severity: moderate

  # ============================================================================
  # WEB STANDARDS & ACCESSIBILITY
  # ============================================================================

  web-standards:
    name: Web Standards & Accessibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install testing tools
        run: |
          npm init -y
          npm install --save-dev @axe-core/cli pa11y

      - name: Start local server
        run: |
          python3 -m http.server 8000 &
          sleep 3

      - name: Accessibility Testing with axe-core
        run: |
          npx axe http://localhost:8000 --save axe-results.json
          if [ -f axe-results.json ]; then
            echo "Axe accessibility results:"
            cat axe-results.json
          fi

      - name: Accessibility Testing with pa11y
        run: |
          npx pa11y http://localhost:8000 --reporter json > pa11y-results.json
          if [ -f pa11y-results.json ]; then
            echo "Pa11y accessibility results:"
            cat pa11y-results.json
          fi

      - name: Upload accessibility test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessibility-reports-${{ github.run_number }}
          path: |
            axe-results.json
            pa11y-results.json

  # ============================================================================
  # PERFORMANCE & SEO TESTING
  # ============================================================================

  performance:
    name: Performance & SEO
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Lighthouse CI
        run: |
          npm init -y
          npm install --save-dev @lhci/cli

      - name: Start local server
        run: |
          python3 -m http.server 8000 &
          sleep 3

      - name: Run Lighthouse CI
        run: |
          npx lhci autorun \
            --collect.url=http://localhost:8000 \
            --collect.numberOfRuns=3 \
            --assert.assertions.categories:performance=0.8 \
            --assert.assertions.categories:accessibility=0.9 \
            --assert.assertions.categories:best-practices=0.8 \
            --assert.assertions.categories:seo=0.8 \
            --upload.target=temporary-public-storage

      - name: Upload Lighthouse reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports-${{ github.run_number }}
          path: .lighthouseci/

  # ============================================================================
  # CROSS-BROWSER TESTING
  # ============================================================================

  cross-browser:
    name: Cross-Browser Testing
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chrome, firefox, edge]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache Playwright browsers
        uses: actions/cache@v3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright
        run: |
          npm init -y
          npm install --save-dev @playwright/test
          npx playwright install --with-deps ${{ matrix.browser }}

      - name: Start local server
        run: |
          python3 -m http.server 8000 &
          sleep 3

      - name: Run Playwright tests
        run: |
          npx playwright test --project=${{ matrix.browser }} --reporter=list

      - name: Upload Playwright test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results-${{ matrix.browser }}-${{ github.run_number }}
          path: playwright-report/

  # ============================================================================
  # DEPLOYMENT (Only on main branch)
  # ============================================================================

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs:
      [code-quality, security-scan, web-standards, performance, cross-browser]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          force_orphan: true


