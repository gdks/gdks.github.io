name: CI/CD Pipeline

on:
  pull_request:
    branches: [main, master, develop, feature/*, bugfix/*, hotfix/*]
  push:
    branches: [main, master, develop, feature/*, bugfix/*, hotfix/*]
  workflow_dispatch:

env:
  NODE_VERSION: '18'

jobs:
  # ============================================================================
  # CODE QUALITY CHECKS
  # ============================================================================

  code-quality:
    name: Code Quality & Standards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm init -y
          npm install --save-dev htmlhint stylelint stylelint-config-standard eslint prettier html-validate

      - name: HTML Linting
        run: npx htmlhint "**/*.html"

      - name: CSS Linting
        run: npx stylelint "**/*.css"

      - name: JavaScript Linting
        run: npx eslint "**/*.js" --ignore-pattern "**/*.min.js"

      - name: Code Formatting Check
        run: npx prettier --check "**/*.{html,css,js,json,md}"

      - name: HTML Validation
        run: npx html-validate "**/*.html"

  # ============================================================================
  # SECURITY CHECKS
  # ============================================================================

  security-scan:
    name: Security Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        if: github.token != ''
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        if: always() && github.token != '' && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Check for hardcoded secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --debug --only-verified

      - name: Dependency Review
        uses: actions/dependency-review-action@v3
        if: github.event_name == 'pull_request'
        with:
          fail-on-severity: moderate
